<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Kalkulator</title>
    </head>
    <body>
        <form>
            <label for="angka1">Angka Pertama:</label>
            <input type="number" name="angka1" id="angka1">
            <label for="angka2">Angka Kedua:</label>
            <input type="number" name="angka2" id="angka2">
            <select id="operasi">
                <option value="tambah">Penjumlahan (+)</option>
                <option value="kurang">Pengurangan (-)</option>
                <option value="kali">Perkalian (*)</option>
                <option value="bagi">Pembagian (/)</option>
            </select>
            <input type="button" onClick="hitung()" value="Hitung">
        </form>
        <div class="result" id="hasilKalkulator"></div>
        <script>
        function hitung() {
            let a1 = parseFloat(document.getElementById('angka1').value);
            let a2 = parseFloat(document.getElementById('angka2').value);
            let op = document.getElementById('operasi').value;
            let output = document.getElementById('hasilKalkulator');

            if (isNaN(a1) || isNaN(a2)) {
                output.innerHTML = "Mohon isi kedua angka dengan benar!";
                return;
            }

            let hasil = 0;
            if (op === 'tambah') {
                hasil = a1 + a2;
            } else if (op === 'kurang') {
                hasil = a1 - a2;
            } else if (op === 'kali') {
                hasil = a1 * a2;
            } else if (op === 'bagi') {
                if (a2 === 0) {
                    output.innerHTML = "Error: Tidak bisa membagi dengan angka 0!";
                    return;
                }
                hasil = a1 / a2;
            }

            output.innerHTML = `Hasil Perhitungan: ${hasil}`;
        }
    </script>
    </body>
</html>
